[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-geo"
version = "0.1.0"
description = "CLI-first causal planet generator with a Python API layer and C++ simulation core."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "msgpack>=1.1,<2",
  "pydantic>=2.10",
  "PyYAML>=6.0.2",
  "typer>=0.16.0",
]

[project.optional-dependencies]
debug = [
  "pyarrow>=19",
  "duckdb>=1.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
]
test = [
  "pytest>=9,<10",
  "pytest-cov>=7",
]

[project.scripts]
magic-geo = "magic_geo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
magic_geo = [
  "libmagic_geo_native.so",
  "magic_geo_native.dll",
  "libmagic_geo_native.dylib",
  "debug_ui/*.html",
  "debug_ui/*.css",
  "debug_ui/*.js",
  "debug_ui/vendor/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".claude", "build", "cmake-build-debug", "cpp", "worlds", "runs"]
markers = [
  "slow: exhaustive CLI validate-command coverage; deselect with -m \"not slow\"",
]

[tool.coverage.run]
# Import name rather than a path so the editable install resolves to src/magic_geo
# and stale worktree copies are never measured.
source = ["magic_geo"]
branch = true
omit = [
  "*/magic_geo/debug_ui/*",
  "*.egg-info/*",
]

[tool.coverage.report]
show_missing = true
precision = 1
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  'if __name__ == "__main__":',
]

[tool.coverage.paths]
magic_geo = ["src/magic_geo", "*/site-packages/magic_geo"]

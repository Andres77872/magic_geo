[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-geo"
version = "0.1.0"
description = "CLI-first causal planet generator with a Python API layer and C++ simulation core."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10",
  "PyYAML>=6.0.2",
  "typer>=0.16.0",
]

[project.scripts]
magic-geo = "magic_geo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
magic_geo = ["seed_config.yaml", "libmagic_geo_native.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]

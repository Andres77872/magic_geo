# Original temperate, land-rich campaign world. The geodesic mesh demonstrates
# the alternative tessellation while the lower water inventory leaves broad
# continents, inland basins, mountain corridors, and navigable coasts.
run:
  seed: 12051001
  name: continental_realm

planet:
  radius_km: 6371.0
  gravity_g: 1.0
  day_length_hours: 24.0
  axial_tilt_deg: 23.5
  orbital_eccentricity: 0.016
  stellar_luminosity: 1.0
  atmosphere_pressure_bar: 1.0
  greenhouse_factor: 1.0
  ocean_fraction_target: 0.58
  ocean_water_inventory_km3: 850000000.0
  internal_heat: 1.0
  geological_age_ga: 4.8

mesh:
  backend: geodesic_icosahedron
  cell_count: 2562
  neighbor_count: 7

tectonics:
  plate_count: 12
  continental_plate_fraction: 0.58
  continental_crust_fraction_target: 0.52
  min_angular_speed: 0.03
  max_angular_speed: 0.85
  boundary_smoothing_steps: 7
  plate_motion_scale_deg_per_step: 3.0
  oceanic_crust_aging_ma_per_step: 5.0

climate:
  months: 12
  lapse_rate_c_per_km: 6.5
  base_temperature_c: 14.0
  precipitation_scale: 1.0
  subtropical_drying_strength: 0.60

hydrology:
  river_percentile: 0.90
  preserve_geologic_depressions: true

erosion:
  iterations: 6
  maturation_timestep_ma: 5.0
  stream_power_coefficient: 7.5
  drainage_exponent: 0.5
  slope_exponent: 1.0
  hillslope_diffusion: 0.055
  tectonic_uplift_scale: 1.0

compute:
  backend: cpu
  threads: 1
  opencl_prefer_gpu: true

output:
  include_cells: true
  float_precision: 4

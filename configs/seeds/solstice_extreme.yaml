config_version: 2

# Original high-obliquity world with severe seasonal contrasts. The 75-degree
# axial tilt is the defining control; it is not a model of irregular or
# multi-year fantasy seasons because the engine always uses twelve months.
run:
  seed: 12051007
  name: solstice_extreme

planet:
  radius_km: 6371.0
  gravity_g: 1.0
  day_length_hours: 30.0
  axial_tilt_deg: 75.0
  orbital_eccentricity: 0.08
  stellar_luminosity: 0.98
  atmosphere_pressure_bar: 1.10
  greenhouse_factor: 1.0
  ocean_fraction_target: 0.66
  # This volume closes exactly in the connected-ocean solve at 2,048 cells.
  ocean_water_inventory_km3: 1100000000.0
  internal_heat: 1.0
  geological_age_ga: 4.5

mesh:
  backend: fibonacci_sphere
  cell_count: 2048
  neighbor_count: 7

tectonics:
  plate_count: 14
  continental_plate_fraction: 0.44
  continental_crust_fraction_target: 0.40
  min_angular_speed: 0.03
  max_angular_speed: 0.90
  boundary_smoothing_steps: 5
  plate_motion_scale_deg_per_step: 3.0
  oceanic_crust_aging_ma_per_step: 5.0

climate:
  months: 12
  reference_infrared_optical_depth: 1.0
  precipitation_scale: 1.0
  subtropical_drying_strength: 0.55

hydrology:
  river_percentile: 0.92
  preserve_geologic_depressions: true

erosion:
  iterations: 6
  maturation_timestep_ma: 5.0
  stream_power_coefficient: 7.5
  drainage_exponent: 0.5
  slope_exponent: 1.0
  hillslope_diffusion: 0.055
  tectonic_uplift_scale: 0.90

compute:
  backend: cpu
  threads: 1
  opencl_prefer_gpu: true

output:
  include_cells: true
  float_precision: 4

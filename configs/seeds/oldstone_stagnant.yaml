config_version: 2

# Original ancient, tectonically stagnant world. Zero procedural plate motion,
# weak internal heat, broad continental crust, and a longer refined erosion run
# favor worn relief, old interiors, closed basins, and sparse young mountains.
run:
  seed: 12051009
  name: oldstone_stagnant

planet:
  radius_km: 6000.0
  gravity_g: 0.90
  day_length_hours: 36.0
  axial_tilt_deg: 8.0
  orbital_eccentricity: 0.02
  stellar_luminosity: 0.90
  atmosphere_pressure_bar: 0.80
  greenhouse_factor: 0.85
  ocean_fraction_target: 0.45
  # The lower inventory closes exactly in this worn, land-heavy basin geometry.
  ocean_water_inventory_km3: 430000000.0
  internal_heat: 0.10
  geological_age_ga: 9.50

mesh:
  backend: fibonacci_sphere
  cell_count: 2048
  neighbor_count: 7

tectonics:
  plate_count: 6
  continental_plate_fraction: 0.70
  continental_crust_fraction_target: 0.65
  min_angular_speed: 0.0
  max_angular_speed: 0.0
  boundary_smoothing_steps: 12
  plate_motion_scale_deg_per_step: 0.0
  oceanic_crust_aging_ma_per_step: 0.0

climate:
  months: 12
  reference_infrared_optical_depth: 1.0
  precipitation_scale: 0.65
  subtropical_drying_strength: 0.72

hydrology:
  river_percentile: 0.94
  preserve_geologic_depressions: true

erosion:
  iterations: 10
  maturation_timestep_ma: 3.0
  stream_power_coefficient: 9.0
  drainage_exponent: 0.5
  slope_exponent: 1.0
  hillslope_diffusion: 0.10
  tectonic_uplift_scale: 0.0

compute:
  backend: cpu
  threads: 1
  opencl_prefer_gpu: true

output:
  include_cells: true
  float_precision: 4

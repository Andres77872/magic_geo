config_version: 2

# Original high-gravity super-Earth campaign world. Radius, gravity, ocean
# inventory, and atmospheric pressure are scaled together; exotic planets are
# supported by the schema but are less calibrated than the Earth reference.
run:
  seed: 12051008
  name: ironroot_super_earth

planet:
  radius_km: 9500.0
  gravity_g: 1.60
  day_length_hours: 30.0
  axial_tilt_deg: 20.0
  orbital_eccentricity: 0.02
  stellar_luminosity: 1.0
  atmosphere_pressure_bar: 1.80
  greenhouse_factor: 1.05
  ocean_fraction_target: 0.70
  # The nearby 3.02e9 value lies on a solvable connected-ocean interval at the
  # declared mesh; the simple Earth-area scaling fell inside a connectivity jump.
  ocean_water_inventory_km3: 3020000000.0
  internal_heat: 1.30
  geological_age_ga: 5.0

mesh:
  backend: fibonacci_sphere
  cell_count: 2048
  neighbor_count: 8

tectonics:
  plate_count: 20
  continental_plate_fraction: 0.42
  continental_crust_fraction_target: 0.36
  min_angular_speed: 0.03
  max_angular_speed: 0.90
  boundary_smoothing_steps: 6
  plate_motion_scale_deg_per_step: 2.5
  oceanic_crust_aging_ma_per_step: 5.0

climate:
  months: 12
  reference_infrared_optical_depth: 1.0
  precipitation_scale: 1.10
  subtropical_drying_strength: 0.60

hydrology:
  river_percentile: 0.91
  preserve_geologic_depressions: true

erosion:
  iterations: 6
  maturation_timestep_ma: 5.0
  stream_power_coefficient: 8.0
  drainage_exponent: 0.5
  slope_exponent: 1.0
  hillslope_diffusion: 0.050
  tectonic_uplift_scale: 1.0

compute:
  backend: cpu
  threads: 1
  opencl_prefer_gpu: true

output:
  include_cells: true
  float_precision: 4

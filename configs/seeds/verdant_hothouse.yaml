# Original warm, wet hothouse world. Strong greenhouse forcing, a dense
# atmosphere, abundant ocean water, and weak subtropical drying encourage broad
# humid biomes, wetlands, large rivers, and vigorous erosion.
run:
  seed: 12051006
  name: verdant_hothouse

planet:
  radius_km: 6800.0
  gravity_g: 1.05
  day_length_hours: 28.0
  axial_tilt_deg: 12.0
  orbital_eccentricity: 0.01
  stellar_luminosity: 1.25
  atmosphere_pressure_bar: 1.80
  greenhouse_factor: 1.55
  ocean_fraction_target: 0.76
  ocean_water_inventory_km3: 1600000000.0
  internal_heat: 1.20
  geological_age_ga: 3.8

mesh:
  backend: fibonacci_sphere
  cell_count: 2048
  neighbor_count: 7

tectonics:
  plate_count: 16
  continental_plate_fraction: 0.38
  continental_crust_fraction_target: 0.30
  min_angular_speed: 0.05
  max_angular_speed: 1.05
  boundary_smoothing_steps: 5
  plate_motion_scale_deg_per_step: 3.5
  oceanic_crust_aging_ma_per_step: 5.0

climate:
  months: 12
  lapse_rate_c_per_km: 5.5
  base_temperature_c: 30.0
  precipitation_scale: 1.80
  subtropical_drying_strength: 0.30

hydrology:
  river_percentile: 0.86
  # Fill closed basins in this preset to favor connected through-drainage.
  preserve_geologic_depressions: false

erosion:
  iterations: 7
  maturation_timestep_ma: 4.0
  stream_power_coefficient: 11.0
  drainage_exponent: 0.55
  slope_exponent: 1.1
  hillslope_diffusion: 0.085
  tectonic_uplift_scale: 1.10

compute:
  backend: cpu
  threads: 1
  opencl_prefer_gpu: true

output:
  include_cells: true
  float_precision: 4

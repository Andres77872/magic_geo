# Original ice-dominated world based on the snowball/slushball climate
# archetype. Reduced stellar forcing and greenhouse trapping are the primary
# controls; liquid refugia are possible and should be inspected after generation.
run:
  seed: 12051004
  name: cryogenic_slushball

planet:
  radius_km: 6371.0
  gravity_g: 1.0
  day_length_hours: 22.0
  axial_tilt_deg: 12.0
  orbital_eccentricity: 0.01
  stellar_luminosity: 0.55
  atmosphere_pressure_bar: 0.90
  greenhouse_factor: 0.50
  ocean_fraction_target: 0.72
  ocean_water_inventory_km3: 1450000000.0
  internal_heat: 0.90
  geological_age_ga: 4.2

mesh:
  backend: fibonacci_sphere
  cell_count: 2048
  neighbor_count: 7

tectonics:
  plate_count: 12
  continental_plate_fraction: 0.40
  continental_crust_fraction_target: 0.34
  min_angular_speed: 0.02
  max_angular_speed: 0.70
  boundary_smoothing_steps: 6
  plate_motion_scale_deg_per_step: 2.5
  oceanic_crust_aging_ma_per_step: 5.0

climate:
  months: 12
  lapse_rate_c_per_km: 6.5
  base_temperature_c: -10.0
  precipitation_scale: 0.60
  subtropical_drying_strength: 0.45

hydrology:
  river_percentile: 0.94
  preserve_geologic_depressions: true

erosion:
  iterations: 5
  maturation_timestep_ma: 5.0
  stream_power_coefficient: 4.5
  drainage_exponent: 0.5
  slope_exponent: 1.0
  hillslope_diffusion: 0.040
  tectonic_uplift_scale: 0.75

compute:
  backend: cpu
  threads: 1
  opencl_prefer_gpu: true

output:
  include_cells: true
  float_precision: 4

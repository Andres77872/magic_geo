# All-in-one magic-geo deployment. Configuration lives in .env (copy
# .env.example). Worlds persist in ${MAGIC_GEO_WORLDS_DIR} on the host.
#
#   mkdir -p worlds        # keep it owned by your user before the first up
#   docker compose up --build -d
#   # web workbench: http://127.0.0.1:8642
#
# One-off CLI runs reuse the same image and worlds volume:
#   docker compose run --rm magic-geo generate \
#     --config configs/earthlike_seed.yaml --output runs/world.json

services:
  magic-geo:
    build:
      context: .
      args:
        PYTHON_VERSION: ${MAGIC_GEO_PYTHON_VERSION:-3.13}
        MAGIC_GEO_ENABLE_CUDA: ${MAGIC_GEO_ENABLE_CUDA:-OFF}
        APP_UID: ${MAGIC_GEO_APP_UID:-1000}
        APP_GID: ${MAGIC_GEO_APP_GID:-1000}
    image: magic-geo:latest
    container_name: magic-geo
    environment:
      # Only runtime settings are injected. Compose-only host paths and image
      # build settings do not need to exist in the container environment.
      MAGIC_GEO_HOST: ${MAGIC_GEO_HOST:-0.0.0.0}
      MAGIC_GEO_PORT: ${MAGIC_GEO_PORT:-8642}
      MAGIC_GEO_WORKSPACE: ${MAGIC_GEO_CONTAINER_WORKSPACE:-/app/runs}
      MAGIC_GEO_NATIVE_LIBRARY: ${MAGIC_GEO_NATIVE_LIBRARY:-}
      MAGIC_GEO_CONFIG_PATH: ${MAGIC_GEO_CONFIG_PATH:-}
      MAGIC_GEO_CONFIG_DIR: ${MAGIC_GEO_CONFIG_DIR:-}
      MAGIC_GEO_SAVED_CONFIG_DIR: ${MAGIC_GEO_SAVED_CONFIG_DIR:-}
      MAGIC_GEO_OUTPUT_DIR: ${MAGIC_GEO_OUTPUT_DIR:-}
      MAGIC_GEO_DEBUG_DIR: ${MAGIC_GEO_DEBUG_DIR:-}
      MAGIC_GEO_REPORTS_DIR: ${MAGIC_GEO_REPORTS_DIR:-}
      MAGIC_GEO_EXPORTS_DIR: ${MAGIC_GEO_EXPORTS_DIR:-}
      MAGIC_GEO_STATE_DIR: ${MAGIC_GEO_STATE_DIR:-}
      MAGIC_GEO_CALIBRATION_DIR: ${MAGIC_GEO_CALIBRATION_DIR:-}
      MAGIC_GEO_PROJECT_ROOT: ${MAGIC_GEO_PROJECT_ROOT:-}
    ports:
      # The workbench has no authentication; the default publishes only on
      # loopback. Set MAGIC_GEO_PUBLISH_HOST=0.0.0.0 only behind a trusted
      # network boundary or authenticating reverse proxy.
      - "${MAGIC_GEO_PUBLISH_HOST:-127.0.0.1}:${MAGIC_GEO_PORT:-8642}:${MAGIC_GEO_PORT:-8642}"
    volumes:
      - "${MAGIC_GEO_WORLDS_DIR:-./worlds}:${MAGIC_GEO_CONTAINER_WORKSPACE:-/app/runs}"
    restart: unless-stopped
